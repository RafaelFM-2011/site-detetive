<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Investigativo</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #eee;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    .questao {
        background: #1c1c1c;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 12px;
        border: 1px solid #333;
    }

    .questao h2 {
        margin-top: 0;
    }

    textarea {
        width: 100%;
        min-height: 100px;
        resize: vertical;
        box-sizing: border-box;
        background: #0d0d0d;
        color: white;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 12px;
        font-size: 16px;
    }

    button {
        display: block;
        margin: 30px auto;
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #eee;
        color: #111;
    }

    button:hover {
        transform: scale(1.03);
    }

    #resultado {
        margin-top: 30px;
    }

    .resultado-box {
        background: #1c1c1c;
        border: 1px solid #444;
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 15px;
    }

    .resultado-box h3 {
        margin-top: 0;
    }

    .explicacao {
        margin-top: 10px;
        line-height: 1.5;
    }

    .dica {
        margin-top: 12px;
        padding: 10px;
        background: #292929;
        border-radius: 8px;
        color: #ddd;
    }

    .nota-final {
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        margin: 30px 0;
    }

    .sucesso {
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        margin-top: 20px;
    }

    .confete {
        position: fixed;
        width: 10px;
        height: 10px;
        top: -20px;
        z-index: 9999;
        animation: cair 3s linear forwards;
    }

    @keyframes cair {
        to {
            transform: translateY(110vh) rotate(720deg);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>🔎 Quiz Investigativo</h1>

    <div class="questao">
        <h2>1. Quem matou Antonio?</h2>
        <textarea id="q1" placeholder="Digite sua resposta..."></textarea>
    </div>

    <div class="questao">
        <h2>2. Por que matou Antonio?</h2>
        <textarea id="q2" placeholder="Explique o motivo..."></textarea>
    </div>

    <div class="questao">
        <h2>3. Como o corpo apareceu novamente na floresta?</h2>
        <textarea id="q3" placeholder="Explique como isso aconteceu..."></textarea>
    </div>

    <div class="questao">
        <h2>4. Explique o que aconteceu naquele dia.</h2>
        <textarea id="q4" placeholder="Reconstrua toda a sequência dos acontecimentos..."></textarea>
    </div>

    <button onclick="verificar()">🔎 Analisar Caso</button>

    <div id="resultado"></div>

</div>

<script>

/* =========================================================
   FUNÇÕES AUXILIARES
========================================================= */

function normalizar(texto) {
    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[.,!?;:()[\]{}"']/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


function contemAlguma(texto, palavras) {
    return palavras.some(palavra => {
        return texto.includes(normalizar(palavra));
    });
}


/* =========================================================
   ANALISADOR DAS PERGUNTAS
========================================================= */

function analisarPergunta(numero, resposta) {

    const texto = normalizar(resposta);

    /* -----------------------------------------------------
       PERGUNTA 1
    ----------------------------------------------------- */

    if (numero === 1) {

        const raimundo = contemAlguma(texto, [
            "raimundo"
        ]);

        const negacao = contemAlguma(texto, [
            "nao foi raimundo",
            "nao matou raimundo",
            "raimundo nao matou",
            "raimundo e inocente",
            "raimundo nao e o assassino"
        ]);

        if (raimundo && !negacao) {

            return {
                pontos: 25,

                explicacao:
                    "Correto. As pistas apontam para Raimundo como o responsável pela morte de Antonio.",

                dica:
                    "Resposta correta."
            };

        } else {

            return {
                pontos: 0,

                explicacao:
                    "A resposta não identifica corretamente o responsável pela morte de Antonio.",

                dica:
                    "Observe principalmente as pistas relacionadas a Raimundo."
            };
        }
    }


    /* -----------------------------------------------------
       PERGUNTA 2
    ----------------------------------------------------- */

    if (numero === 2) {

        let motivos = 0;

        /*
         * 1 — Rivalidade entre Raimundo e Antonio
         */

        const rivalidade = contemAlguma(texto, [
            "rival",
            "rivalidade",
            "concorrente",
            "concorrencia",
            "disputa",
            "conflito",
            "inimigo",
            "briga"
        ]);

        /*
         * 2 — Empresa de tecidos
         */

        const tecidos = contemAlguma(texto, [
            "tecido",
            "tecidos",
            "textil",
            "empresa textil",
            "empresa de tecidos",
            "fabrica de tecidos"
        ]);

        /*
         * 3 — Antonio roubava / revendia produtos
         */

        const roubo = contemAlguma(texto, [
            "roubava",
            "roubou",
            "roubo",
            "roubar",
            "roubando",
            "furtava",
            "furto",
            "produtos",
            "mercadorias",
            "revendia",
            "revender",
            "revenda",
            "vendia produtos",
            "vender produtos"
        ]);

        /*
         * 4 — Fraudes / dinheiro / prejuízo
         */

        const dinheiro = contemAlguma(texto, [
            "dinheiro",
            "prejuizo",
            "prejuizo financeiro",
            "fraude",
            "fraudes",
            "corrupcao",
            "lavagem de dinheiro",
            "perdas",
            "ganhar dinheiro",
            "perdeu dinheiro"
        ]);

        if (rivalidade) motivos++;
        if (tecidos) motivos++;
        if (roubo) motivos++;
        if (dinheiro) motivos++;


        if (motivos >= 3) {

            return {
                pontos: 25,

                explicacao:
                    "Muito bom. Você identificou os principais motivos ligados ao conflito entre Raimundo e Antonio, incluindo a disputa comercial e os produtos que Antonio roubava ou revendia.",

                dica:
                    "Resposta completa."
            };

        } else if (motivos === 2) {

            return {
                pontos: 25,

                explicacao:
                    "Sua resposta encontrou os elementos centrais do motivo do crime. Raimundo tinha um conflito com Antonio envolvendo a empresa de tecidos e os produtos que Antonio roubava e revendia.",

                dica:
                    "Você encontrou o motivo principal."
            };

        } else if (motivos === 1) {

            return {
                pontos: 15,

                explicacao:
                    "Você identificou apenas parte do motivo. Havia um conflito comercial entre Raimundo e Antonio envolvendo tecidos e os produtos que Antonio roubava ou revendia.",

                dica:
                    "Procure relacionar Raimundo, a empresa de tecidos e os produtos de Antonio."
            };

        } else {

            return {
                pontos: 0,

                explicacao:
                    "O motivo apresentado não corresponde às principais pistas do caso.",

                dica:
                    "Pense na relação entre Raimundo, Antonio e a empresa de tecidos."
            };
        }
    }


    /* -----------------------------------------------------
       PERGUNTA 3
    ----------------------------------------------------- */

    if (numero === 3) {

        let elementos = 0;

        /*
         * O corpo desapareceu da mansão
         */

        const desaparecimento = contemAlguma(texto, [
            "corpo desapareceu",
            "corpo sumiu",
            "corpo desaparece",
            "corpo foi retirado",
            "corpo saiu",
            "tiraram o corpo",
            "levaram o corpo",
            "corpo foi levado"
        ]);

        /*
         * Passagem secreta
         */

        const passagem = contemAlguma(texto, [
            "passagem secreta",
            "passagem escondida",
            "porta secreta",
            "porta escondida",
            "passagem",
            "biblioteca",
            "saiu pela passagem"
        ]);

        /*
         * Local onde a passagem começa
         */

        const escritorio = contemAlguma(texto, [
            "escritorio",
            "mesa de antonio",
            "debaixo da mesa",
            "biblioteca",
            "sala de antonio"
        ]);

        /*
         * Floresta / cabana / lago
         */

        const floresta = contemAlguma(texto, [
            "floresta",
            "cabana",
            "bosque",
            "mato",
            "lago"
        ]);

        /*
         * Livro 9 / documentos
         */

        const livro = contemAlguma(texto, [
            "livro 9",
            "livro nove",
            "livro",
            "documento",
            "documentos",
            "cartas",
            "provas"
        ]);


        if (desaparecimento) elementos++;
        if (passagem) elementos++;
        if (escritorio) elementos++;
        if (floresta) elementos++;
        if (livro) elementos++;


        if (elementos >= 4) {

            return {
                pontos: 25,

                explicacao:
                    "Correto. As pistas indicam que o desaparecimento do corpo estava ligado à passagem secreta, à biblioteca e aos acontecimentos que levaram à floresta.",

                dica:
                    "Resposta completa."
            };

        } else if (elementos >= 2) {

            return {
                pontos: 15,

                explicacao:
                    "Você identificou parte do caminho, mas ainda faltam pistas importantes para explicar completamente como Antonio desapareceu e apareceu na floresta.",

                dica:
                    "Observe a passagem secreta, a biblioteca, o livro 9 e a ligação com a floresta."
            };

        } else {

            return {
                pontos: 0,

                explicacao:
                    "A explicação ainda não relaciona as principais pistas do desaparecimento de Antonio.",

                dica:
                    "Procure entender o papel da passagem secreta e do livro 9."
            };
        }
    }


    /* -----------------------------------------------------
       PERGUNTA 4
    ----------------------------------------------------- */

    if (numero === 4) {

        /*
         * Cada variável representa uma parte da teoria.
         */

        const investigacao = contemAlguma(texto, [
            "investigacao",
            "policia",
            "seria investigado",
            "iriam investigar",
            "seria interrogado",
            "investigar antonio",
            "dia 10",
            "10 de agosto",
            "policia investigaria"
        ]);


        const falsaMorte = contemAlguma(texto, [
            "fingiu a morte",
            "fingiu estar morto",
            "fingiu que morreu",
            "simulou a morte",
            "simulou sua morte",
            "simulou a propria morte",
            "fingiu a propria morte",
            "falsa morte",
            "propria morte",
            "fingiu que estava morto",
            "fez parecer que estava morto"
        ]);


        const passagem = contemAlguma(texto, [
            "passagem secreta",
            "passagem escondida",
            "porta secreta",
            "porta escondida",
            "saiu pela passagem",
            "fugiu pela passagem",
            "passagem"
        ]);


        const apagao = contemAlguma(texto, [
            "apagao",
            "as luzes apagaram",
            "as luzes se apagaram",
            "luz apagou",
            "luzes apagadas",
            "ficou escuro",
            "ficou tudo escuro",
            "escuro",
            "falta de luz",
            "energia acabou"
        ]);


        const floresta = contemAlguma(texto, [
            "floresta",
            "cabana",
            "bosque",
            "mato"
        ]);


        const fuga = contemAlguma(texto, [
            "fugir",
            "fuga",
            "escapar",
            "escapou",
            "escaparia",
            "fugiria",
            "deixar a cidade",
            "sair da cidade",
            "ir embora",
            "fugir da cidade"
        ]);


        const documentos = contemAlguma(texto, [
            "documentos",
            "documento",
            "provas",
            "cartas",
            "dinheiro",
            "livro 9",
            "livro nove",
            "livro"
        ]);


        const raimundoMatou =
            (
                contemAlguma(texto, ["raimundo"]) &&
                contemAlguma(texto, [
                    "matou",
                    "assassinou",
                    "matar",
                    "assassino",
                    "responsavel pela morte",
                    "responsavel por matar",
                    "culpado",
                    "foi o culpado"
                ])
            )
            ||
            contemAlguma(texto, [
                "antonio foi morto por raimundo",
                "antonio foi assassinado por raimundo",
                "raimundo foi quem matou",
                "raimundo matou antonio",
                "raimundo assassinou antonio",
                "raimundo matou",
                "morto por raimundo",
                "assassinado por raimundo"
            ]);


        /*
         * Conta quantas partes da teoria foram encontradas.
         */

        const etapas = [
            investigacao,
            falsaMorte,
            passagem,
            apagao,
            floresta,
            fuga,
            documentos,
            raimundoMatou
        ];

        const quantidade = etapas.filter(Boolean).length;


        /*
         * NOTA DA QUESTÃO 4
         */

        if (quantidade === 8) {

            return {
                pontos: 25,

                explicacao:
                    "Perfeito! Você reconstruiu toda a sequência: Antonio descobriu que seria investigado, simulou a própria morte, aproveitou o apagão, utilizou a passagem secreta, foi para a floresta tentando fugir com os documentos e acabou sendo morto por Raimundo.",

                dica:
                    "Você solucionou completamente a sequência dos acontecimentos."
            };

        } else if (quantidade >= 6) {

            return {
                pontos: 20,

                explicacao:
                    "Sua reconstrução está quase completa. Você encontrou a maior parte da sequência, mas uma ou duas peças importantes ainda estão faltando.",

                dica:
                    "Pense no motivo de Antonio querer desaparecer e no que aconteceu com ele depois de chegar à floresta."
            };

        } else if (quantidade >= 4) {

            return {
                pontos: 15,

                explicacao:
                    "Você encontrou vários elementos importantes, mas ainda falta conectar as pistas para reconstruir toda a história.",

                dica:
                    "Relacione a investigação policial, a passagem secreta, o apagão, a fuga e Raimundo."
            };

        } else {

            return {
                pontos: 0,

                explicacao:
                    "A reconstrução ainda não explica os principais acontecimentos daquele dia.",

                dica:
                    "Tente montar a sequência dos acontecimentos desde a descoberta da investigação até a floresta."
            };
        }
    }


    /*
     * Caso não exista a questão
     */

    return {
        pontos: 0,
        explicacao: "Não foi possível analisar esta questão.",
        dica: "Tente novamente."
    };
}


/* =========================================================
   VERIFICAR TUDO
========================================================= */

function verificar() {

    const respostas = [
        document.getElementById("q1").value,
        document.getElementById("q2").value,
        document.getElementById("q3").value,
        document.getElementById("q4").value
    ];


    let total = 0;

    let html = "";


    respostas.forEach((resposta, index) => {

        const numero = index + 1;

        const analise = analisarPergunta(numero, resposta);

        total += analise.pontos;


        html += `
            <div class="resultado-box">

                <h3>
                    Questão ${numero}: ${analise.pontos}/25
                </h3>

                <div class="explicacao">
                    ${analise.explicacao || "Não foi possível gerar uma explicação."}
                </div>

                <div class="dica">
                    💡 ${analise.dica || "Nenhuma dica disponível."}
                </div>

            </div>
        `;
    });


    html += `
        <div class="nota-final">
            Resultado final: ${total}/100
        </div>
    `;


    if (total === 100) {

        html += `
            <div class="sucesso">
                🎉 Caso totalmente resolvido! Detetive perfeito.
            </div>
        `;

    } else {

        html += `
            <div class="sucesso">
                Continue investigando as pistas.
            </div>
        `;
    }


    document.getElementById("resultado").innerHTML = html;


    /*
     * Só comemora se conseguir 100/100.
     */

    if (total === 100) {

        tocarSom();

        soltarConfetes();


        setTimeout(() => {

            window.open("./resultado.png", "_blank");

        }, 3500);
    }
}


/* =========================================================
   SOM
========================================================= */

function tocarSom() {

    const audio = new Audio(
        "https://www.soundjay.com/human/applause-8.mp3"
    );

    audio.volume = 0.7;

    audio.play().catch(() => {
        console.log("O navegador bloqueou a reprodução automática do som.");
    });
}


/* =========================================================
   CONFETES
========================================================= */

function soltarConfetes() {

    const quantidade = 120;

    for (let i = 0; i < quantidade; i++) {

        const confete = document.createElement("div");

        confete.className = "confete";

        confete.style.left =
            Math.random() * 100 + "vw";

        confete.style.animationDuration =
            (2 + Math.random() * 2) + "s";

        confete.style.background =
            `hsl(${Math.random() * 360}, 100%, 50%)`;

        confete.style.transform =
            `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(confete);


        setTimeout(() => {
            confete.remove();
        }, 4000);
    }
}

</script>

</body>
</html>
