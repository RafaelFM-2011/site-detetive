<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Investigativo</title>

<style>
    body {
        margin: 0;
        padding: 20px;
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    .questao {
        background: #1b1b1b;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
    }

    .questao h2 {
        margin-top: 0;
    }

    textarea {
        width: 100%;
        min-height: 110px;
        box-sizing: border-box;
        resize: vertical;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #444;
        background: #0b0b0b;
        color: white;
        font-size: 16px;
        font-family: Arial, sans-serif;
    }

    button {
        display: block;
        margin: 30px auto;
        padding: 15px 30px;
        border: none;
        border-radius: 10px;
        background: white;
        color: black;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        transform: scale(1.03);
    }

    #resultado {
        margin-top: 30px;
    }

    .resultado-box {
        background: #1b1b1b;
        border: 1px solid #444;
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 15px;
    }

    .resultado-box h3 {
        margin-top: 0;
    }

    .explicacao {
        line-height: 1.5;
        margin-top: 10px;
    }

    .dica {
        margin-top: 12px;
        padding: 12px;
        background: #292929;
        border-radius: 8px;
        line-height: 1.4;
    }

    .nota-final {
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        margin: 30px 0;
    }

    .sucesso {
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        margin: 25px 0;
    }

    .confete {
        position: fixed;
        width: 10px;
        height: 10px;
        top: -20px;
        z-index: 9999;
        animation: cair 3s linear forwards;
    }

    @keyframes cair {
        to {
            transform: translateY(110vh) rotate(720deg);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>🔎 Quiz Investigativo</h1>


    <!-- QUESTÃO 1 -->

    <div class="questao">
        <h2>1. Quem matou Antonio?</h2>

        <textarea
            id="q1"
            placeholder="Digite sua resposta..."
        ></textarea>
    </div>


    <!-- QUESTÃO 2 -->

    <div class="questao">
        <h2>2. Por que matou Antonio?</h2>

        <textarea
            id="q2"
            placeholder="Explique o motivo..."
        ></textarea>
    </div>


    <!-- QUESTÃO 3 -->

    <div class="questao">
        <h2>3. Como o corpo apareceu novamente na floresta?</h2>

        <textarea
            id="q3"
            placeholder="Explique o que aconteceu..."
        ></textarea>
    </div>


    <!-- QUESTÃO 4 -->

    <div class="questao">
        <h2>4. Explique o que aconteceu naquele dia.</h2>

        <textarea
            id="q4"
            placeholder="Reconstrua toda a história..."
        ></textarea>
    </div>


    <button onclick="verificar()">
        🔎 Analisar Caso
    </button>


    <div id="resultado"></div>

</div>


<script>

/* =========================================================
   NORMALIZAÇÃO
========================================================= */

function normalizar(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[.,!?;:()[\]{}"']/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   VERIFICA SE EXISTE ALGUMA EXPRESSÃO
========================================================= */

function contemAlguma(texto, lista) {

    return lista.some(item => {
        return texto.includes(normalizar(item));
    });
}


/* =========================================================
   QUESTÃO 1
========================================================= */

function analisarQ1(resposta) {

    const texto = normalizar(resposta);

    const temRaimundo =
        contemAlguma(texto, [
            "raimundo"
        ]);

    const negouRaimundo =
        contemAlguma(texto, [
            "nao foi raimundo",
            "raimundo nao matou",
            "raimundo e inocente",
            "raimundo nao e o assassino"
        ]);

    if (temRaimundo && !negouRaimundo) {

        return {
            pontos: 25,

            explicacao:
                "Correto. Raimundo é o responsável pela morte de Antonio.",

            dica:
                "Resposta correta."
        };

    }

    return {
        pontos: 0,

        explicacao:
            "A resposta não identifica corretamente o responsável pela morte de Antonio.",

        dica:
            "Observe as pistas relacionadas a Raimundo."
    };
}


/* =========================================================
   QUESTÃO 2
========================================================= */

function analisarQ2(resposta) {

    const texto = normalizar(resposta);


    /*
       A pergunta é:
       "Por que matou Antonio?"

       A ideia principal é que Raimundo tinha
       um conflito com Antonio porque Antonio
       roubava produtos / tecidos.
    */


    const roubo = contemAlguma(texto, [

        "roubava",
        "roubou",
        "roubo",
        "roubar",
        "roubando",
        "furtava",
        "furtou",
        "furto",
        "pegava os produtos",
        "pegava produtos",
        "roubava produtos",
        "roubava os produtos",
        "roubava tecidos",
        "roubava os tecidos",
        "roubo de produtos",
        "roubo dos produtos",
        "roubo de tecidos",
        "roubo dos tecidos"

    ]);


    const produtos = contemAlguma(texto, [

        "produto",
        "produtos",
        "mercadoria",
        "mercadorias",
        "tecido",
        "tecidos",
        "empresa textil",
        "empresa de tecidos",
        "fabrica de tecidos"

    ]);


    const rivalidade = contemAlguma(texto, [

        "rival",
        "rivalidade",
        "concorrente",
        "concorrencia",
        "disputa",
        "conflito",
        "inimigo",
        "briga",
        "problema entre eles",
        "problemas entre eles"

    ]);


    const dinheiro = contemAlguma(texto, [

        "dinheiro",
        "prejuizo",
        "prejuizo financeiro",
        "fraude",
        "fraudes",
        "corrupcao",
        "lavagem de dinheiro",
        "perda financeira"

    ]);


    /*
       Se o usuário simplesmente responder:

       "porque ele roubava"

       isso já responde corretamente à pergunta.
    */

    if (roubo) {

        return {
            pontos: 25,

            explicacao:
                "Correto. Antonio roubava produtos ligados à empresa de Raimundo, criando o conflito que levou ao crime.",

            dica:
                "Resposta correta."
        };
    }


    /*
       Outras formas de explicar o mesmo motivo.
    */

    if (produtos && rivalidade) {

        return {
            pontos: 25,

            explicacao:
                "Correto. Você relacionou a rivalidade entre Raimundo e Antonio com os negócios e os produtos envolvidos no conflito.",

            dica:
                "Resposta correta."
        };
    }


    if (produtos && dinheiro) {

        return {
            pontos: 25,

            explicacao:
                "Você identificou o conflito comercial e financeiro relacionado aos produtos e negócios de Antonio.",

            dica:
                "Resposta correta."
        };
    }


    if (rivalidade || produtos || dinheiro) {

        return {
            pontos: 15,

            explicacao:
                "Você encontrou parte do motivo, mas faltou relacionar melhor o conflito entre Raimundo e Antonio.",

            dica:
                "Pense no que Antonio fazia com os produtos da empresa de Raimundo."
        };
    }


    return {
        pontos: 0,

        explicacao:
            "O motivo apresentado não corresponde às principais pistas do caso.",

        dica:
            "Observe a relação de Antonio com os produtos e a empresa de Raimundo."
    };
}


/* =========================================================
   QUESTÃO 3
========================================================= */

function analisarQ3(resposta) {

    const texto = normalizar(resposta);


    /*
       Parte 1:
       Antonio fingiu a própria morte.
    */

    const falsaMorte = contemAlguma(texto, [

        "fingiu sua morte",
        "fingiu a propria morte",
        "fingiu sua propria morte",
        "fingiu estar morto",
        "fingiu que morreu",
        "fingiu que estava morto",
        "simulou a morte",
        "simulou sua morte",
        "simulou a propria morte",
        "simulou que morreu",
        "falsa morte",
        "propria morte"

    ]);


    /*
       Parte 2:
       Usou a passagem secreta.
    */

    const passagem = contemAlguma(texto, [

        "passagem secreta",
        "passagem escondida",
        "porta secreta",
        "porta escondida",
        "passagem",
        "saiu pela passagem",
        "fugiu pela passagem"

    ]);


    /*
       Parte 3:
       Foi para a floresta.
    */

    const floresta = contemAlguma(texto, [

        "floresta",
        "cabana",
        "bosque",
        "mato"

    ]);


    /*
       Parte 4:
       Apagão / desaparecimento.
    */

    const apagao = contemAlguma(texto, [

        "apagao",
        "luzes apagaram",
        "luzes se apagaram",
        "luz apagou",
        "ficou escuro",
        "ficou tudo escuro",
        "escuro",
        "falta de luz",
        "energia acabou"

    ]);


    /*
       Se a resposta contém a explicação
       principal, vale 25.
    */

    if (falsaMorte && passagem && floresta) {

        return {
            pontos: 25,

            explicacao:
                "Correto. Antonio simulou sua morte para desaparecer da mansão, utilizou a passagem secreta e seguiu em direção à floresta.",

            dica:
                "Resposta correta."
        };
    }


    /*
       Também aceitamos uma explicação baseada
       na passagem e no desaparecimento.
    */

    if (passagem && floresta && apagao) {

        return {
            pontos: 25,

            explicacao:
                "Correto. O apagão permitiu o desaparecimento, e a passagem secreta explica como Antonio conseguiu sair da mansão e chegar à região da floresta.",

            dica:
                "Resposta correta."
        };
    }


    if ((falsaMorte && passagem) ||
        (passagem && floresta)) {

        return {
            pontos: 15,

            explicacao:
                "Você encontrou uma parte importante da explicação, mas ainda falta relacionar todas as pistas.",

            dica:
                "Pense na morte falsa, na passagem secreta e no caminho até a floresta."
        };
    }


    return {
        pontos: 0,

        explicacao:
            "A explicação não relaciona as principais pistas sobre o desaparecimento de Antonio.",

        dica:
            "Observe a passagem secreta e o que aconteceu durante o apagão."
    };
}


/* =========================================================
   QUESTÃO 4
========================================================= */

function analisarQ4(resposta) {

    const texto = normalizar(resposta);


    /*
       1 — Antonio seria investigado.
    */

    const investigacao = contemAlguma(texto, [

        "seria investigado",
        "seria investigada",
        "iriam investigar antonio",
        "policia investigaria",
        "investigacao policial",
        "investigacao",
        "policia",
        "dia 10",
        "10 de agosto",
        "investigar antonio"

    ]);


    /*
       2 — Antonio fingiu a própria morte.
    */

    const falsaMorte = contemAlguma(texto, [

        "fingiu sua morte",
        "fingiu a propria morte",
        "fingiu sua propria morte",
        "fingiu estar morto",
        "fingiu que morreu",
        "fingiu que estava morto",
        "simulou a morte",
        "simulou sua morte",
        "simulou a propria morte",
        "simulou que morreu",
        "falsa morte"

    ]);


    /*
       3 — Passagem secreta.
    */

    const passagem = contemAlguma(texto, [

        "passagem secreta",
        "passagem escondida",
        "porta secreta",
        "porta escondida",
        "fugir pela passagem",
        "fugiu pela passagem",
        "saiu pela passagem",
        "passagem"

    ]);


    /*
       4 — Apagão.
    */

    const apagao = contemAlguma(texto, [

        "quando a luz apagar",
        "quando as luzes apagarem",
        "quando as luzes apagaram",
        "quando a luz apagou",
        "luz apagar",
        "luzes apagaram",
        "luzes se apagaram",
        "apagao",
        "ficou escuro",
        "ficou tudo escuro",
        "escuro",
        "falta de luz"

    ]);


    /*
       5 — Floresta.
    */

    const floresta = contemAlguma(texto, [

        "floresta",
        "cabana",
        "bosque",
        "mato"

    ]);


    /*
       6 — Fuga.
    */

    const fuga = contemAlguma(texto, [

        "fugir",
        "fuga",
        "fugiria",
        "fugiu",
        "escapar",
        "escaparia",
        "escapou",
        "deixar a cidade",
        "sair da cidade",
        "ir embora",
        "fugir da cidade"

    ]);


    /*
       7 — Documentos.
    */

    const documentos = contemAlguma(texto, [

        "documento",
        "documentos",
        "prova",
        "provas",
        "cartas",
        "livro 9",
        "livro nove"

    ]);


    /*
       8 — Raimundo matou Antonio.
    */

    const raimundoMatou =

        (
            contemAlguma(texto, ["raimundo"]) &&
            contemAlguma(texto, [
                "matou",
                "matar",
                "assassinou",
                "assassino",
                "culpado",
                "responsavel pela morte",
                "responsavel por matar",
                "foi o culpado"
            ])
        )

        ||

        contemAlguma(texto, [

            "raimundo matou antonio",
            "raimundo matou",
            "raimundo assassinou antonio",
            "raimundo assassinou",
            "antonio foi morto por raimundo",
            "antonio foi assassinado por raimundo",
            "morto por raimundo",
            "assassinado por raimundo"

        ]);


    /*
       Junta todas as partes.
    */

    const etapas = [

        investigacao,
        falsaMorte,
        passagem,
        apagao,
        floresta,
        fuga,
        documentos,
        raimundoMatou

    ];


    const quantidade =
        etapas.filter(Boolean).length;


    /*
       RESPOSTA COMPLETA
    */

    if (quantidade === 8) {

        return {
            pontos: 25,

            explicacao:
                "Perfeito! Você reconstruiu toda a sequência: Antonio descobriu que seria investigado no dia 10, simulou sua morte, aproveitou o apagão, utilizou a passagem secreta, foi para a floresta tentando fugir da cidade com os documentos e acabou sendo morto por Raimundo.",

            dica:
                "Caso completamente solucionado."
        };
    }


    /*
       Quase completa.
    */

    if (quantidade >= 6) {

        return {
            pontos: 20,

            explicacao:
                "Sua reconstrução está quase completa. Você encontrou a maior parte das pistas, mas ainda faltam uma ou duas conexões importantes.",

            dica:
                "Revise a sequência desde a investigação policial até o encontro com Raimundo."
        };
    }


    /*
       Parcial.
    */

    if (quantidade >= 4) {

        return {
            pontos: 15,

            explicacao:
                "Você encontrou várias pistas importantes, mas ainda não conectou toda a sequência dos acontecimentos.",

            dica:
                "Relacione a investigação, a falsa morte, a passagem secreta, o apagão, a fuga e Raimundo."
        };
    }


    return {
        pontos: 0,

        explicacao:
            "A reconstrução ainda não apresenta elementos suficientes para explicar o que aconteceu naquele dia.",

        dica:
            "Tente reconstruir os acontecimentos em ordem."
    };
}


/* =========================================================
   VERIFICAR AS 4 QUESTÕES
========================================================= */

function verificar() {

    const resposta1 =
        document.getElementById("q1").value;

    const resposta2 =
        document.getElementById("q2").value;

    const resposta3 =
        document.getElementById("q3").value;

    const resposta4 =
        document.getElementById("q4").value;


    /*
       Analisa cada resposta.
    */

    const resultado1 =
        analisarQ1(resposta1);

    const resultado2 =
        analisarQ2(resposta2);

    const resultado3 =
        analisarQ3(resposta3);

    const resultado4 =
        analisarQ4(resposta4);


    /*
       Soma.
    */

    const total =
        resultado1.pontos +
        resultado2.pontos +
        resultado3.pontos +
        resultado4.pontos;


    /*
       Monta o resultado.
    */

    let html = "";


    html += criarResultado(
        1,
        resultado1
    );


    html += criarResultado(
        2,
        resultado2
    );


    html += criarResultado(
        3,
        resultado3
    );


    html += criarResultado(
        4,
        resultado4
    );


    html += `
        <div class="nota-final">
            Resultado final: ${total}/100
        </div>
    `;


    /*
       Caso perfeito.
    */

    if (total === 100) {

        html += `
            <div class="sucesso">
                🎉 Caso totalmente resolvido! Detetive perfeito.
            </div>
        `;

    } else {

        html += `
            <div class="sucesso">
                🔎 Continue investigando as pistas.
            </div>
        `;
    }


    document.getElementById("resultado").innerHTML =
        html;


    /*
       Comemoração.
    */

    if (total === 100) {

        tocarSom();

        soltarConfetes();


        setTimeout(() => {

            window.open(
                "./resultado.png",
                "_blank"
            );

        }, 3500);
    }
}


/* =========================================================
   CRIAR CAIXA DE RESULTADO
========================================================= */

function criarResultado(numero, resultado) {

    return `
        <div class="resultado-box">

            <h3>
                Questão ${numero}: ${resultado.pontos}/25
            </h3>

            <div class="explicacao">
                ${resultado.explicacao}
            </div>

            <div class="dica">
                💡 ${resultado.dica}
            </div>

        </div>
    `;
}


/* =========================================================
   SOM
========================================================= */

function tocarSom() {

    const audio = new Audio(
        "https://www.soundjay.com/human/applause-8.mp3"
    );

    audio.volume = 0.7;


    audio.play().catch(() => {

        console.log(
            "O navegador bloqueou a reprodução automática do som."
        );

    });
}


/* =========================================================
   CONFETES
========================================================= */

function soltarConfetes() {

    const quantidade = 120;


    for (let i = 0; i < quantidade; i++) {

        const confete =
            document.createElement("div");


        confete.className =
            "confete";


        confete.style.left =
            Math.random() * 100 + "vw";


        confete.style.animationDuration =
            (2 + Math.random() * 2) + "s";


        confete.style.background =
            `hsl(${Math.random() * 360}, 100%, 50%)`;


        confete.style.transform =
            `rotate(${Math.random() * 360}deg)`;


        document.body.appendChild(confete);


        setTimeout(() => {

            confete.remove();

        }, 4000);
    }
}

</script>

</body>
</html>
