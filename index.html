<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Investigativo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            background: #1b1b1b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        .pergunta {
            margin-bottom: 25px;
            padding: 20px;
            background: #242424;
            border-radius: 10px;
        }

        .pergunta h2 {
            margin-top: 0;
            font-size: 20px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            resize: vertical;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #111;
            color: white;
            font-size: 16px;
        }

        textarea:focus {
            outline: none;
            border-color: #888;
        }

        button {
            display: block;
            margin: 30px auto 10px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #eee;
            color: #111;
        }

        button:hover {
            background: #ccc;
        }

        #resultado {
            margin-top: 30px;
        }

        .analise {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: #292929;
            border-left: 5px solid #777;
        }

        .analise h3 {
            margin-top: 0;
        }

        .dica {
            margin-top: 10px;
            color: #bbb;
            font-size: 14px;
        }

        .nota {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .perfeito {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🕵️ Quiz Investigativo</h1>

    <p class="subtitulo">
        Analise as pistas e descubra o que realmente aconteceu.
    </p>

    <div class="pergunta">
        <h2>1. Quem matou Antonio?</h2>
        <textarea id="resposta1" placeholder="Digite sua resposta..."></textarea>
    </div>

    <div class="pergunta">
        <h2>2. Por que matou Antonio?</h2>
        <textarea id="resposta2" placeholder="Digite sua resposta..."></textarea>
    </div>

    <div class="pergunta">
        <h2>3. Como o corpo apareceu novamente na floresta?</h2>
        <textarea id="resposta3" placeholder="Digite sua resposta..."></textarea>
    </div>

    <div class="pergunta">
        <h2>4. Explique o que aconteceu naquele dia.</h2>
        <textarea id="resposta4" placeholder="Explique sua teoria completa..."></textarea>
    </div>

    <button type="button" onclick="verificar()">
        🔎 Analisar Caso
    </button>

    <div id="resultado"></div>

</div>

<script>

    // =========================================================
    // NORMALIZAÇÃO
    // =========================================================

    function normalizar(texto) {
        return texto
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[.,!?;:()"']/g, " ")
            .replace(/\s+/g, " ")
            .trim();
    }


    // =========================================================
    // VERIFICA SE EXISTE ALGUMA PALAVRA
    // =========================================================

    function contemAlguma(texto, palavras) {

        return palavras.some(function(palavra) {
            return texto.includes(normalizar(palavra));
        });

    }


    // =========================================================
    // ANALISA CADA PERGUNTA
    // =========================================================

    function analisarPergunta(numero, resposta) {

        const texto = normalizar(resposta);


        // =====================================================
        // PERGUNTA 1
        // =====================================================

        if (numero === 1) {

            const acertou = contemAlguma(texto, [
                "raimundo"
            ]);

            if (acertou) {

                return {
                    pontos: 25,
                    explicacao:
                        "Correto. Raimundo é apontado pelas pistas como o responsável pela morte de Antonio.",
                    dica:
                        "As roupas de Raimundo, sua presença na floresta e seu comportamento levantam fortes suspeitas."
                };

            }

            return {
                pontos: 0,
                explicacao:
                    "Essa resposta não corresponde ao principal suspeito indicado pelas pistas.",
                dica:
                    "Observe principalmente as pistas envolvendo Raimundo e sua relação com Antonio."
            };
        }


        // =====================================================
        // PERGUNTA 2
        // =====================================================

        if (numero === 2) {

            let pontos = 0;

            // Relação entre os dois
            if (contemAlguma(texto, [
                "rival",
                "rivalidade",
                "concorrente",
                "concorrencia",
                "disputa",
                "conflito"
            ])) {
                pontos += 1;
            }

            // Empresa têxtil
            if (contemAlguma(texto, [
                "textil",
                "tecido",
                "tecidos",
                "empresa textil"
            ])) {
                pontos += 1;
            }

            // Roubo de produtos
            if (contemAlguma(texto, [
                "roubo",
                "roubar",
                "roubava",
                "roubou",
                "roubando",
                "produtos",
                "produto",
                "revendia",
                "revender"
            ])) {
                pontos += 1;
            }

            // Prejuízo / vingança
            if (contemAlguma(texto, [
                "vinganca",
                "vingar",
                "prejudicar",
                "prejuizo",
                "dinheiro",
                "fraude"
            ])) {
                pontos += 1;
            }


            if (pontos >= 2) {

                return {
                    pontos: 25,
                    explicacao:
                        "Correto. O conflito entre Raimundo e Antonio estava ligado aos negócios, à empresa têxtil e às acusações de que Antonio roubava ou revendia produtos.",
                    dica:
                        "Você identificou o motivo principal."
                };

            }


            if (pontos === 1) {

                return {
                    pontos: 15,
                    explicacao:
                        "Você encontrou uma parte do motivo, mas faltou relacionar melhor Raimundo, Antonio e o conflito envolvendo os negócios.",
                    dica:
                        "Tente explicar por que o conflito entre os dois poderia ter levado Raimundo a querer se vingar."
                };

            }


            return {
                pontos: 0,
                explicacao:
                    "A resposta não apresenta claramente o motivo principal.",
                dica:
                    "Observe as pistas sobre Raimundo, a empresa têxtil e os produtos que Antonio estaria roubando ou revendendo."
            };

        }


        // =====================================================
        // PERGUNTA 3
        // =====================================================

        if (numero === 3) {

            let pontos = 0;


            if (contemAlguma(texto, [
                "corpo",
                "desapareceu",
                "desaparecimento",
                "sumiu"
            ])) {
                pontos++;
            }


            if (contemAlguma(texto, [
                "passagem secreta",
                "porta secreta",
                "passagem",
                "porta escondida"
            ])) {
                pontos++;
            }


            if (contemAlguma(texto, [
                "escritorio",
                "escritório",
                "biblioteca",
                "biblioteca"
            ])) {
                pontos++;
            }


            if (contemAlguma(texto, [
                "floresta",
                "florest",
                "mata",
                "lago",
                "cabana"
            ])) {
                pontos++;
            }


            if (contemAlguma(texto, [
                "livro 9",
                "livro nove",
                "documentos",
                "documentos escondidos"
            ])) {
                pontos++;
            }


            if (pontos >= 4) {

                return {
                    pontos: 25,
                    explicacao:
                        "Muito bem. Você relacionou o desaparecimento do corpo, a passagem secreta, a biblioteca e as pistas que levam até a floresta.",
                    dica:
                        "Você encontrou praticamente todas as pistas importantes."
                };

            }


            if (pontos >= 2) {

                return {
                    pontos: 15,
                    explicacao:
                        "Você encontrou algumas pistas importantes, mas ainda faltam elementos para explicar completamente o desaparecimento e reaparecimento do corpo.",
                    dica:
                        "Observe a passagem secreta, o livro 9 e a ligação com a floresta."
                };

            }


            return {
                pontos: 0,
                explicacao:
                    "A resposta ainda não relaciona pistas suficientes para explicar o que aconteceu com o corpo.",
                dica:
                    "Procure relacionar a passagem secreta, a biblioteca, o livro 9 e a floresta."
            };

        }


        // =====================================================
        // PERGUNTA 4
        // =====================================================

        if (numero === 4) {

            /*
             * A pergunta 4 é a mais difícil.
             *
             * Em vez de procurar apenas uma palavra,
             * analisamos várias partes da teoria.
             */

            let etapasEncontradas = 0;


            // 1 — Antonio seria investigado
            if (contemAlguma(texto, [
                "investigado",
                "investigacao",
                "investigação",
                "policia",
                "polícia",
                "dia 10"
            ])) {
                etapasEncontradas++;
            }


            // 2 — Antonio fingiu a própria morte
            if (contemAlguma(texto, [
                "fingiu sua morte",
                "fingiu a propria morte",
                "fingiu a própria morte",
                "fingiu morte",
                "simulou sua morte",
                "simulou a propria morte",
                "simulou a própria morte",
                "morte falsa",
                "fingir a morte"
            ])) {
                etapasEncontradas++;
            }


            // 3 — Passagem secreta
            if (contemAlguma(texto, [
                "passagem secreta",
                "porta secreta",
                "passagem escondida",
                "porta escondida"
            ])) {
                etapasEncontradas++;
            }


            // 4 — Apagão
            if (contemAlguma(texto, [
                "apagao",
                "apagão",
                "luz apagou",
                "luzes apagaram",
                "luz apagada",
                "ficou escuro",
                "escuro"
            ])) {
                etapasEncontradas++;
            }


            // 5 — Floresta
            if (contemAlguma(texto, [
                "floresta",
                "florest",
                "mata",
                "cabana"
            ])) {
                etapasEncontradas++;
            }


            // 6 — Tentativa de fuga
            if (contemAlguma(texto, [
                "fugir",
                "fuga",
                "escapar",
                "escapou",
                "sair da cidade",
                "deixar a cidade"
            ])) {
                etapasEncontradas++;
            }


            // 7 — Documentos
            if (contemAlguma(texto, [
                "documento",
                "documentos",
                "cartas",
                "carta"
            ])) {
                etapasEncontradas++;
            }


            // 8 — Raimundo matou Antonio
            if (
                texto.includes("raimundo matou") ||
                texto.includes("morto por raimundo") ||
                texto.includes("morto pelo raimundo") ||
                texto.includes("raimundo o matou") ||
                (
                    texto.includes("raimundo") &&
                    texto.includes("matou")
                )
            ) {
                etapasEncontradas++;
            }


            // =================================================
            // CALCULA A PORCENTAGEM
            // =================================================

            const porcentagem = Math.round(
                (etapasEncontradas / 8) * 100
            );


            // =================================================
            // 100%
            // =================================================

            if (porcentagem === 100) {

                return {
                    pontos: 25,
                    explicacao:
                        "Excelente! Sua reconstrução reúne todas as principais etapas: Antonio seria investigado no dia 10, fingiu a própria morte, utilizou a passagem secreta durante o apagão, seguiu para a floresta tentando fugir da cidade com os documentos e acabou sendo morto por Raimundo.",
                    dica:
                        "Você conseguiu reconstruir toda a sequência dos acontecimentos."
                };

            }


            // =================================================
            // 75% OU MAIS
            // =================================================

            if (porcentagem >= 75) {

                return {
                    pontos: 20,
                    explicacao:
                        "Sua teoria está muito próxima da solução. Você encontrou a maior parte das etapas, mas deixou alguns acontecimentos importantes de fora.",
                    dica:
                        "Tente conectar a investigação, a falsa morte, a passagem secreta, o apagão, a floresta, os documentos e Raimundo."
                };

            }


            // =================================================
            // 50% OU MAIS
            // =================================================

            if (porcentagem >= 50) {

                return {
                    pontos: 15,
                    explicacao:
                        "Você encontrou várias pistas importantes, mas sua reconstrução ainda está incompleta.",
                    dica:
                        "Tente organizar as pistas como uma sequência de acontecimentos."
                };

            }


            // =================================================
            // MENOS DE 50%
            // =================================================

            return {
                pontos: 0,
                explicacao:
                    "Sua explicação ainda não reúne pistas suficientes para reconstruir o que aconteceu.",
                dica:
                    "Observe a investigação do dia 10, a passagem secreta, o apagão, a floresta, os documentos e Raimundo."
            };

        }


        // Caso o número da pergunta esteja errado
        return {
            pontos: 0,
            explicacao: "Não foi possível analisar esta pergunta.",
            dica: "Tente novamente."
        };

    }


    // =========================================================
    // ANALISAR CASO
    // =========================================================

    function verificar() {

        try {

            const respostas = [
                document.getElementById("resposta1").value,
                document.getElementById("resposta2").value,
                document.getElementById("resposta3").value,
                document.getElementById("resposta4").value
            ];


            let total = 0;

            let html = "";


            for (let i = 0; i < respostas.length; i++) {

                const analise = analisarPergunta(
                    i + 1,
                    respostas[i]
                );


                // Segurança contra undefined
                const explicacao =
                    analise.explicacao ||
                    "Não foi possível gerar uma explicação.";

                const dica =
                    analise.dica ||
                    "Nenhuma dica disponível.";


                total += analise.pontos || 0;


                html += `
                    <div class="analise">

                        <h3>
                            Pergunta ${i + 1} — ${analise.pontos || 0}/25
                        </h3>

                        <p>
                            ${explicacao}
                        </p>

                        <div class="dica">
                            💡 <strong>Dica:</strong> ${dica}
                        </div>

                    </div>
                `;

            }


            // =================================================
            // RESULTADO FINAL
            // =================================================

            let classificacao = "";


            if (total === 100) {

                classificacao =
                    "🕵️ DETETIVE PERFEITO! CASO RESOLVIDO!";

            } else if (total >= 75) {

                classificacao =
                    "🔎 Excelente investigação!";

            } else if (total >= 50) {

                classificacao =
                    "🧐 Você encontrou várias pistas importantes.";

            } else {

                classificacao =
                    "🔍 Ainda existem muitas pistas para descobrir.";

            }


            document.getElementById("resultado").innerHTML = `

                <div class="nota">
                    ${total}/100
                </div>

                <div class="perfeito">
                    ${classificacao}
                </div>

                ${html}

            `;


            // =================================================
            // 100% — SOM + CONFETES
            // =================================================

            if (total === 100) {

                tocarSom();

                soltarConfetes();

                setTimeout(function() {

                    window.open(
                        "./resultado.png",
                        "_blank"
                    );

                }, 3500);

            }

        } catch (erro) {

            console.error(erro);

            document.getElementById("resultado").innerHTML = `

                <div class="analise">

                    <h3>⚠️ Erro ao analisar o caso</h3>

                    <p>
                        Ocorreu um erro no sistema de análise.
                    </p>

                    <p>
                        Abra o console do navegador para ver o erro.
                    </p>

                </div>

            `;

        }

    }


    // =========================================================
    // SOM
    // =========================================================

    function tocarSom() {

        try {

            const audio = new Audio(
                "https://www.soundjay.com/human/applause-8.mp3"
            );

            audio.volume = 0.8;

            audio.play().catch(function(erro) {

                console.log(
                    "O navegador bloqueou o áudio:",
                    erro
                );

            });

        } catch (erro) {

            console.log(
                "Não foi possível tocar o som.",
                erro
            );

        }

    }


    // =========================================================
    // CONFETES
    // =========================================================

    function soltarConfetes() {

        const duracao = 3000;

        const fim = Date.now() + duracao;


        function criarConfete() {

            const confete = document.createElement("div");

            confete.style.position = "fixed";
            confete.style.width = "10px";
            confete.style.height = "10px";

            confete.style.left =
                Math.random() * 100 + "vw";

            confete.style.top = "-10px";

            confete.style.background =
                "hsl(" +
                Math.random() * 360 +
                ", 100%, 50%)";

            confete.style.zIndex = "9999";

            confete.style.pointerEvents = "none";


            document.body.appendChild(confete);


            const velocidade =
                2 + Math.random() * 5;

            let posicao = -10;


            const intervalo = setInterval(function() {

                posicao += velocidade;

                confete.style.top =
                    posicao + "px";

                confete.style.transform =
                    "rotate(" +
                    Math.random() * 360 +
                    "deg)";


                if (posicao > window.innerHeight) {

                    clearInterval(intervalo);

                    confete.remove();

                }

            }, 16);

        }


        const intervaloConfetes =
            setInterval(function() {

                criarConfete();
                criarConfete();
                criarConfete();

                if (Date.now() > fim) {

                    clearInterval(intervaloConfetes);

                }

            }, 80);

    }

</script>

</body>
</html>
